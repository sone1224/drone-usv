<script type="module">
// 당사 모델 A·B·C·D 가상 프로토타입 3D 렌더러 (물리 기반 재질 · 하늘 · 바다 반사)
// 형상 참고: 당사 시제품(무광 검정 각진 선체, 선수 파노라마 카메라 포드, 흰 EO/IR 짐벌, 위성 평판, 선미 장비함·통풍구,
// 흰 안테나 기둥, 측면 스폰슨, 선외기)과 디자인 포스터(경사 핀 타워). 모델 C는 임무 베이 덮개까지만, D는 무장 없음.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const rnd = (() => { let s = 12345; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();

// ---------- 재질 ----------
const M = {
  matteBlack: () => new THREE.MeshPhysicalMaterial({ color: 0x1b1e22, roughness: 0.72, metalness: 0.05, clearcoat: 0.15, clearcoatRoughness: 0.6, flatShading: true, side: THREE.DoubleSide }),
  navy: () => new THREE.MeshPhysicalMaterial({ color: 0x0f1d33, roughness: 0.35, metalness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.2, flatShading: true, side: THREE.DoubleSide }),
  gelWhite: () => new THREE.MeshPhysicalMaterial({ color: 0xf2f4f5, roughness: 0.25, metalness: 0.0, clearcoat: 0.8, clearcoatRoughness: 0.12, flatShading: true, side: THREE.DoubleSide }),
  gray: (c = 0x59626b) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.55, metalness: 0.15, clearcoat: 0.3, clearcoatRoughness: 0.4, flatShading: true, side: THREE.DoubleSide }),
  plastic: (c = 0xf3f5f6) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.32, metalness: 0, clearcoat: 0.5, clearcoatRoughness: 0.25 }),
  glass: () => new THREE.MeshPhysicalMaterial({ color: 0x0a0f14, roughness: 0.05, metalness: 0.3, clearcoat: 1, clearcoatRoughness: 0.02 }),
  lens: () => new THREE.MeshPhysicalMaterial({ color: 0x1b3a55, roughness: 0.02, metalness: 0.6, clearcoat: 1, emissive: 0x05121c }),
  rubber: () => new THREE.MeshStandardMaterial({ color: 0x121416, roughness: 0.9 }),
  paint: (c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.4, metalness: 0.05, clearcoat: 0.6, flatShading: true, side: THREE.DoubleSide }),
  solar: () => new THREE.MeshPhysicalMaterial({ color: 0x0d1d3a, roughness: 0.12, metalness: 0.4, clearcoat: 1, clearcoatRoughness: 0.05 }),
};

// ---------- 각진 선체(단면 로프트) ----------
function hullParams(p) {
  const n = p.n || 9, sec = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n, x = (s - 0.5) * p.L;
    let fb = s < 0.55 ? 0.94 + 0.06 * (s / 0.55) : Math.sqrt(Math.max(0, 1 - Math.pow((s - 0.55) / 0.45, 2)));
    fb = Math.max(fb, 0.03);
    const hb = (p.B / 2) * fb, rise = s > 0.45 ? Math.pow((s - 0.45) / 0.55, 1.8) : 0, F = p.F, T = p.T;
    const rake = rise * p.L * 0.1;
    sec.push({
      s, x,
      keel: V(x - rake, -T + rise * (T + 0.2 * F), 0),
      chine: [x - rake * 0.6, -T * 0.3 + rise * (T * 0.3 + 0.3 * F), hb * 0.82],
      knuck: [x - rake * 0.15, F * 0.42 + rise * 0.12 * F, hb],
      sheer: [x, F + rise * 0.28 * F, hb * 0.9],
      crown: F + rise * 0.28 * F + 0.06 * p.B * fb,
    });
  }
  return sec;
}
function hullMesh(p, mats) {
  const sec = hullParams(p);
  const ring = (c) => [V(c.x, c.crown, 0), V(c.sheer[0], c.sheer[1], c.sheer[2]), V(c.knuck[0], c.knuck[1], c.knuck[2]), V(c.chine[0], c.chine[1], c.chine[2]), c.keel,
    V(c.chine[0], c.chine[1], -c.chine[2]), V(c.knuck[0], c.knuck[1], -c.knuck[2]), V(c.sheer[0], c.sheer[1], -c.sheer[2])];
  const groupOf = (j) => (j === 0 || j === 7) ? 'deck' : (j === 1 || j === 6) ? 'upper' : 'lower';
  const pos = { deck: [], upper: [], lower: [] };
  const tri = (g, a, b, c) => pos[g].push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  for (let i = 0; i < sec.length - 1; i++) {
    const A = ring(sec[i]), B = ring(sec[i + 1]);
    for (let j = 0; j < 8; j++) { const k = (j + 1) % 8, g = groupOf(j); tri(g, A[j], B[j], B[k]); tri(g, A[j], B[k], A[k]); }
  }
  const cap = (R, g) => { const c = R.reduce((a, v) => a.add(v.clone()), V(0, 0, 0)).multiplyScalar(1 / R.length); for (let j = 0; j < 8; j++) tri(j === 0 || j === 7 ? 'deck' : g, R[j], R[(j + 1) % 8], c); };
  cap(ring(sec[0]), 'lower'); cap(ring(sec[sec.length - 1]), 'lower');
  const grp = new THREE.Group();
  for (const g of ['deck', 'upper', 'lower']) {
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos[g], 3)); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mats[g]); m.castShadow = m.receiveShadow = true; grp.add(m);
  }
  grp.userData.deckY = (s) => { const i = Math.min(sec.length - 2, Math.floor(s * (sec.length - 1))); const t = s * (sec.length - 1) - i; return sec[i].crown * (1 - t) + sec[i + 1].crown * t; };
  grp.userData.sec = sec;
  return grp;
}

// ---------- 부품 ----------
const add = (g, m, x, y, z, rx = 0, ry = 0, rz = 0) => { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
const convex = (pts, mat) => new THREE.Mesh(new ConvexGeometry(pts.map((p) => V(...p))), mat);
const box = (w, h, d, mat, r = 0.02) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
const cyl = (r1, r2, h, mat, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
function ptz(scale = 1) {
  const g = new THREE.Group(), w = M.plastic(0xf4f6f7), d = M.plastic(0xd5dade);
  add(g, cyl(0.1, 0.11, 0.04, d), 0, 0.02, 0);
  add(g, cyl(0.075, 0.085, 0.14, w), 0, 0.11, 0);
  add(g, box(0.15, 0.2, 0.2, w, 0.06), 0, 0.29, 0);
  add(g, cyl(0.045, 0.045, 0.02, M.glass()), 0.1, 0.32, 0.03, 0, 0, Math.PI / 2);
  add(g, cyl(0.03, 0.03, 0.02, M.lens()), 0.1, 0.32, 0.03, 0, 0, Math.PI / 2);
  add(g, cyl(0.03, 0.03, 0.02, M.glass()), 0.1, 0.24, -0.03, 0, 0, Math.PI / 2);
  g.scale.setScalar(scale); return g;
}
function panCam(scale = 1) {
  const g = new THREE.Group();
  add(g, convex([[0, 0, -0.16], [0, 0, 0.16], [-0.12, 0, -0.18], [-0.12, 0, 0.18], [-0.02, 0.07, -0.13], [-0.02, 0.07, 0.13], [-0.12, 0.07, -0.15], [-0.12, 0.07, 0.15]], M.gray(0x8a949c)), 0, 0, 0);
  [-0.09, -0.03, 0.03, 0.09].forEach((z) => add(g, cyl(0.022, 0.022, 0.02, M.lens()), 0.005, 0.035, z, 0, 0, Math.PI / 2));
  g.scale.setScalar(scale); return g;
}
const dome = (r = 0.07) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.plastic(0xefe9da)); m.scale.y = 0.55; m.castShadow = true; return m; };
function satPanel() { const g = new THREE.Group(); add(g, box(0.52, 0.03, 0.42, M.plastic(0xf1f3f4), 0.012), 0, 0.12, 0, 0, 0, -0.18); add(g, cyl(0.03, 0.03, 0.12, M.gray(0x6d7780)), 0, 0.06, 0); return g; }
const pole = (h = 0.9, r = 0.035) => { const m = cyl(r, r, h, M.plastic(0xeef1f3)); m.geometry.translate(0, h / 2, 0); return m; };
function outboard(scale = 1) {
  const g = new THREE.Group(), blk = new THREE.MeshPhysicalMaterial({ color: 0x0d0f11, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08 });
  add(g, convex([[-0.05, 0, -0.18], [-0.05, 0, 0.18], [-0.42, 0, -0.17], [-0.42, 0, 0.17], [-0.08, 0.5, -0.15], [-0.08, 0.5, 0.15], [-0.4, 0.55, -0.14], [-0.4, 0.55, 0.14], [-0.2, 0.62, 0]], blk), 0, 0, 0);
  add(g, box(0.16, 0.9, 0.09, M.gray(0x2a2f33), 0.03), -0.18, -0.42, 0);
  add(g, box(0.34, 0.1, 0.12, M.gray(0x22272b), 0.04), -0.22, -0.86, 0);
  add(g, box(0.02, 0.06, 0.3, M.plastic(0xd8dde0), 0.008), -0.06, 0.42, 0, 0, 0, 0.1);
  g.scale.setScalar(scale); return g;
}
function decal(text, color = '#ffffff', w = 1.0, h = 0.22, font = 'bold 120px Arial') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 224; const x = c.getContext('2d');
  x.font = font; x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 10, 116);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, transparent: true, roughness: 0.5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  return m;
}
function stripeTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#5c656d'; x.fillRect(0, 0, 512, 256); x.strokeStyle = '#f2c230'; x.lineWidth = 14; x.setLineDash([40, 24]); x.strokeRect(10, 10, 492, 236);
  x.fillStyle = '#f2c230'; x.font = 'bold 34px Arial'; x.fillText('MISSION BAY · I/F', 120, 140);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------- 공통 시제품 계열 장비 배치 ----------
function familyKit(g, hull, p, o = {}) {
  const L = p.L, hb = p.B / 2, dy = hull.userData.deckY;
  const at = (s) => (s - 0.5) * L;
  // 선수 각진 덮개(plateau)
  const s0 = 0.5, s1 = 0.86, y0 = dy(0.62) - 0.04, hgt = o.plateauH ?? 0.16;
  add(g, convex([[at(s0), y0, -hb * 0.78], [at(s0), y0, hb * 0.78], [at(s1), dy(s1) - 0.04, -hb * 0.26], [at(s1), dy(s1) - 0.04, hb * 0.26],
    [at(s0 + 0.04), y0 + hgt, -hb * 0.52], [at(s0 + 0.04), y0 + hgt, hb * 0.52], [at(s1 - 0.08), y0 + hgt * 0.85, -hb * 0.18], [at(s1 - 0.08), y0 + hgt * 0.85, hb * 0.18]], o.plateauMat || M.matteBlack()), 0, 0, 0);
  const py = y0 + hgt;
  add(g, panCam(o.panScale ?? 1), at(s1 - 0.07), py - 0.03, 0, 0, 0, -0.35);
  add(g, dome(0.065), at(0.66), py, 0);
  // 선미 장비함 + 통풍구
  const a0 = 0.12, a1 = 0.42, ay = dy(0.3) - 0.03, ah = o.aftH ?? 0.3;
  add(g, convex([[at(a0), ay, -hb * 0.62], [at(a0), ay, hb * 0.62], [at(a1), ay, -hb * 0.62], [at(a1), ay, hb * 0.62], [at(a0 + 0.02), ay + ah, -hb * 0.55], [at(a0 + 0.02), ay + ah, hb * 0.55], [at(a1 - 0.03), ay + ah, -hb * 0.55], [at(a1 - 0.03), ay + ah, hb * 0.55]], o.aftMat || M.matteBlack()), 0, 0, 0);
  const vent = box(0.22, 0.09, 0.02, M.gray(0x111315), 0.01); add(g, vent, at(a1 - 0.1), ay + ah * 0.55, hb * 0.555);
  for (let i = 0; i < 5; i++) add(g, box(0.012, 0.06, 0.01, M.plastic(0xc9d0d5), 0.003), at(a1 - 0.1) - 0.08 + i * 0.04, ay + ah * 0.55, hb * 0.567);
  if (o.sat !== false) add(g, satPanel(), at((a0 + a1) / 2), ay + ah, 0);
  // 측면 스폰슨, 안테나 기둥
  [1, -1].forEach((sd) => {
    const sp = new THREE.Mesh(new THREE.CapsuleGeometry(0.09 * (p.B / 1.3), L * 0.28, 6, 16), M.rubber()); add(g, sp, at(0.27), dy(0.27) + 0.06, sd * hb * 0.86, 0, 0, Math.PI / 2);
    if (o.poles !== false) add(g, pole(o.poleH ?? 0.95), at(0.07), dy(0.07), sd * hb * 0.7);
  });
  // 선수 범퍼(카메라형 노브)
  [1, -1].forEach((sd) => add(g, cyl(0.06, 0.06, 0.08, M.rubber()), at(0.86), dy(0.86) - 0.08, sd * hb * 0.32, Math.PI / 2, 0, 0));
  return { py, at, dy, ay, ah };
}

// ---------- 모델 ----------
function modelA() {
  const p = { L: 3.4, B: 1.3, F: 0.42, T: 0.22, n: 9 };
  const g = new THREE.Group(), hull = hullMesh(p, { deck: M.matteBlack(), upper: M.matteBlack(), lower: M.navy() }); g.add(hull);
  const k = familyKit(g, hull, p, { plateauH: 0.15, aftH: 0.28, poleH: 0.85 });
  add(g, ptz(1), k.at(0.56), k.py, 0);
  // 주황 레일(인명구조 식별), 구조부이
  const sec = hull.userData.sec;
  [1, -1].forEach((sd) => { const pts = sec.map((c) => V(c.knuck[0], c.knuck[1] + 0.01, sd * (c.knuck[2] + 0.012))); const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.018, 8), M.paint(0xff6a1f)); tube.castShadow = true; g.add(tube); });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.055, 16, 48), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.5 }));
  const tex = document.createElement('canvas'); tex.width = 256; tex.height = 16; const tx = tex.getContext('2d'); for (let i = 0; i < 8; i++) { tx.fillStyle = i % 2 ? '#ffffff' : '#d6261a'; tx.fillRect(i * 32, 0, 32, 16); }
  ring.material.map = new THREE.CanvasTexture(tex); ring.material.map.colorSpace = THREE.SRGBColorSpace;
  add(g, ring, k.at(0.3), k.ay + k.ah + 0.03, 0, Math.PI / 2, 0, 0);
  add(g, outboard(0.85), -p.L / 2 - 0.02, 0.05, 0);
  const d1 = decal('A-01  인명구조', '#ff7a2e', 1.1, 0.24, 'bold 104px Malgun Gothic'); add(g, d1, -0.15, p.F * 0.62, p.B / 2 + 0.005);
  return { g, p, look: V(0.1, 0.95, 0) };
}
function modelB() {
  const p = { L: 6.0, B: 2.0, F: 0.62, T: 0.32, n: 10 };
  const g = new THREE.Group(), hull = hullMesh(p, { deck: M.gelWhite(), upper: M.gelWhite(), lower: M.navy() }); g.add(hull);
  const k = familyKit(g, hull, p, { plateauMat: M.gelWhite(), aftMat: M.gelWhite(), plateauH: 0.2, aftH: 0.38, poleH: 1.3, panScale: 1.3, sat: false });
  { const sec = hull.userData.sec; [1, -1].forEach((sd) => { const pts = sec.map((c) => V(c.knuck[0], c.knuck[1] + 0.012, sd * (c.knuck[2] + 0.014))); const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.03, 8), M.paint(0x0e8f9a)); g.add(tube); }); }
  add(g, ptz(1.25), k.at(0.56), k.py, 0);
  for (let i = 0; i < 2; i++) add(g, box(0.78, 0.03, 1.05, M.solar(), 0.01), k.at(0.27) + (i - 0.5) * 0.84, k.ay + k.ah + 0.03, 0, 0, 0, -0.06);
  add(g, satPanel(), k.at(0.62), k.py, 0.45);
  // 기상 마스트
  const mx = k.at(0.45), my = k.py;
  add(g, cyl(0.035, 0.045, 2.0, M.plastic(0xe9edf0)), mx, my + 1.0, 0);
  add(g, cyl(0.02, 0.02, 0.9, M.gray(0x8a959e)), mx, my + 1.85, 0, Math.PI / 2, 0, 0);
  const cups = new THREE.Group(); add(cups, cyl(0.012, 0.012, 0.12, M.gray(0x8a959e)), 0, 0.06, 0);
  for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2; add(cups, cyl(0.005, 0.005, 0.14, M.gray(0x8a959e)), Math.cos(a) * 0.07, 0.12, Math.sin(a) * 0.07, 0, -a, Math.PI / 2); add(cups, new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 8, 0, Math.PI), M.plastic()), Math.cos(a) * 0.14, 0.12, Math.sin(a) * 0.14, 0, -a, 0); }
  add(g, cups, mx, my + 1.86, 0.42);
  add(g, convex([[0, 0, 0], [-0.3, 0.04, 0], [-0.3, -0.04, 0], [-0.32, 0.12, 0.01], [-0.32, -0.12, 0.01], [-0.32, 0.12, -0.01], [-0.32, -0.12, -0.01], [0.02, 0.01, 0.01], [0.02, -0.01, -0.01]], M.plastic()), mx + 0.05, my + 1.9, -0.42);
  add(g, pole(0.5, 0.012), mx, my + 2.0, 0);
  add(g, cyl(0.025, 0.025, 0.9, M.paint(0x6b7782)), p.L / 2 - 0.55, 0.35, 0.3, 0, 0, -0.75);
  const d1 = decal('B-01  해양관측', '#0b4f60', 1.6, 0.3, 'bold 110px Malgun Gothic'); add(g, d1, -0.9, p.F * 0.66, p.B / 2 + 0.006);
  return { g, p, look: V(0.2, 1.4, 0) };
}
function modelC() {
  const p = { L: 6.6, B: 1.9, F: 0.55, T: 0.3, n: 10 };
  const g = new THREE.Group(), hull = hullMesh(p, { deck: M.gray(0x6f7880), upper: M.gray(0x4f5961), lower: M.gray(0x272d32) }); g.add(hull);
  const k = familyKit(g, hull, p, { plateauMat: M.gray(0x666f77), aftMat: M.gray(0x3a4248), plateauH: 0.12, aftH: 0.26, poleH: 0.8, sat: false });
